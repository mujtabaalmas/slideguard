[build-system] 
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slideguard"
version = "0.1.2"
requires-python = ">=3.9"

description = "A simple and lightweight rate limiter decorator for Python"

readme = { file = "README.md", content-type = "text/markdown" }

authors = [
  { name="Mujtaba", email="contact@mujtabaalmas.me" }
]

license = { text = "MIT" }

keywords = ["rate limiter", "python", "decorator", "api", "throttling"]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
include = ["slideguard*"]